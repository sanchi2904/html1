<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Join Us</title>
  <style>
    body {
      background: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);
      display: flex;
      height: 100vh;
      justify-content: center;
      align-items: center;
      font-family: Arial;
    }
    .form-box {
      background: rgba(255, 255, 255, 0.2);
      padding: 30px;
      border-radius: 12px;
      backdrop-filter: blur(8px);
      text-align: center;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    }
    input, button {
      padding: 10px;
      margin: 10px;
      width: 200px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
    }
    button {
      background-color: #6a11cb;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #2575fc;
    }
  </style>
</head>
<body>
  <div class="form-box">
    <h2>🚀 Let's Get Started</h2>
    <input type="text" placeholder="Enter your name"><br>
    <button>Submit</button>
  </div>
</body>
</html>
