<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Color Change Button</title>
  <style>
    body {
      background-color: #f7f7f7;
      text-align: center;
      padding-top: 100px;
      font-family: sans-serif;
    }
    button {
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background-color: #e91e63;
      color: white;
      transition: background-color 0.4s ease;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <button onclick="changeColor()">Click to Change Color</button>

  <script>
    function changeColor() {
      const colors = ['#e91e63', '#3f51b5', '#009688', '#ff5722', '#607d8b'];
      const randomColor = colors[Math.floor(Math.random() * colors.length)];
      document.querySelector('button').style.backgroundColor = randomColor;
    }
  </script>
</body>
</html>
