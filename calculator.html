<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Calculator</title>
  <style>
    body {
      background: linear-gradient(to right, #1c92d2, #f2fcfe);
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    input {
      padding: 10px;
      margin: 10px;
      width: 80px;
      font-size: 18px;
    }
    button {
      padding: 10px 15px;
      font-size: 18px;
      background: #0062ff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    #result {
      margin-top: 15px;
      font-size: 20px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>
  <h2>🧮 Stylish Calculator</h2>
  <input type="number" id="num1" placeholder="Num 1"> +
  <input type="number" id="num2" placeholder="Num 2">
  <br>
  <button onclick="addNumbers()">Calculate</button>
  <div id="result">Result: 0</div>

  <script>
    function addNumbers() {
      const num1 = parseFloat(document.getElementById('num1').value);
      const num2 = parseFloat(document.getElementById('num2').value);
      const sum = num1 + num2;
      document.getElementById('result').innerText = `Result: ${sum}`;
    }
  </script>
</body>
</html>
